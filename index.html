<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuk va Qarz Nazorati</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans pb-10">
    <div class="container mx-auto p-4 max-w-md">
        <h1 class="text-2xl font-bold text-blue-600 text-center mb-2">🚛 Yuk va Qarz Nazorati</h1>
        <p id="userInfo" class="text-xs text-gray-500 text-center mb-4">Yuklanmoqda...</p>

        <!-- Forma -->
        <div class="bg-white p-4 rounded-xl shadow-md mb-4">
            <form id="loadForm" class="space-y-3">
                <div>
                    <label class="text-sm font-medium">Mashina Raqami:</label>
                    <input type="text" id="carNumber" required placeholder="01A777AA" class="w-full p-2 border rounded uppercase font-bold" oninput="this.value = this.value.toUpperCase()">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs">Qatnov:</label>
                        <input type="number" id="tripAdd" value="1" class="w-full p-2 border rounded text-center">
                    </div>
                    <div>
                        <label class="text-xs">Qarz (so'm):</label>
                        <input type="number" id="debtAdd" placeholder="0" class="w-full p-2 border rounded">
                    </div>
                </div>
                <div>
                    <label class="text-xs">To'lov (so'm):</label>
                    <input type="number" id="cashAdd" placeholder="0" class="w-full p-2 border rounded">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold p-3 rounded">Saqlash</button>
            </form>
        </div>

        <!-- Jadval -->
        <div class="bg-white p-4 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-2">Bugungi ro'yxat</h2>
            <table class="w-full text-xs border-collapse">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="p-2 text-left">Mashina</th>
                        <th class="p-2 text-center">Qatnov</th>
                        <th class="p-2 text-right">Qarz</th>
                        <th class="p-2 text-right">To'ladi</th>
                        <th class="p-2 text-right">Qoldiq</th>
                    </tr>
                </thead>
                <tbody id="loadTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Siz yuborgan Realtime Database manzili avtomatik ulandi
        const firebaseConfig = {
            databaseURL: "https://yuk-nazorati-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- O'Z TELEGRAM ID RAQAMINGIZNI SHU YERGA YOZING ---
        const ADMIN_IDS = [8081723573]; 

        let tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe?.user;
        let userId = user ? user.id : null;
        let userName = user ? user.first_name : "Mehmon";
        document.getElementById('userInfo').textContent = `Foydalanuvchi: ${userName}`;

        let isAdmin = ADMIN_IDS.includes(userId);

        const form = document.getElementById('loadForm');
        const tableBody = document.getElementById('loadTableBody');

        db.ref("trucks").on("value", (snapshot) => {
            let data = snapshot.val();
            let allData = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    allData.push({ id: key, ...data[key] });
                });
            }
            renderTable(allData);
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const todayStr = new Date().toISOString().split('T')[0];
            
            const newRef = db.ref("trucks").push();
            newRef.set({
                dateOnly: todayStr,
                user: userName,
                userId: userId,
                carNumber: document.getElementById('carNumber').value.toUpperCase(),
                tripCount: parseInt(document.getElementById('tripAdd').value) || 0,
                debt: parseFloat(document.getElementById('debtAdd').value) || 0,
                cash: parseFloat(document.getElementById('cashAdd').value) || 0
            }).then(() => form.reset());
        });

        function renderTable(data) {
            tableBody.innerHTML = '';
            const todayStr = new Date().toISOString().split('T')[0];
            let filtered = data.filter(item => item.dateOnly === todayStr && (isAdmin || item.userId === userId));

            filtered.forEach(item => {
                let balance = item.debt - item.cash;
                if (balance < 0) balance = 0;
                tableBody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-2 font-bold">${item.carNumber}<br><span class="text-[10px] text-gray-400">(${item.user})</span></td>
                        <td class="p-2 text-center">${item.tripCount}</td>
                        <td class="p-2 text-right text-red-600">${item.debt.toLocaleString()}</td>
                        <td class="p-2 text-right text-green-600">${item.cash.toLocaleString()}</td>
                        <td class="p-2 text-right font-bold text-red-700">${balance.toLocaleString()}</td>
                    </tr>`;
            });
        }
    </script>
</body>
</html>
