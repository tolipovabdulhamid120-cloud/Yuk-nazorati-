<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuk Nazorati Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #2481cc;
      --danger-color: #e74c3c;
      --success-color: #2ecc71;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
    }
    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    h2, h3 { margin-top: 0; color: var(--primary-color); }
    .form-group {
      margin-bottom: 12px;
      position: relative;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      padding-right: 45px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    #plateNumber { text-transform: uppercase; font-weight: bold; }
    .voice-btn {
      position: absolute;
      right: 5px;
      top: 24px;
      background: #e0e0e0;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn {
      width: 100%;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-excel { background: #27ae60; margin-bottom: 6px; }
    .btn-send { background: #8e44ad; margin-bottom: 10px; }
    .btn-danger { background: var(--danger-color); }
    .btn-cancel { background: #7f8c8d; }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th { background-color: #f2f2f2; }
    tfoot tr { background-color: #eaf2f8; font-weight: bold; }
    .debt-text { color: var(--danger-color); font-weight: bold; }
    .paid-text { color: var(--success-color); font-weight: bold; }
    .action-btn {
      padding: 4px 8px;
      font-size: 11px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
      margin-right: 2px;
    }
    .actions-cell { white-space: nowrap; }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="formTitle">Yangi yuk qo'shish</h2>
    <form id="truckForm">
      <input type="hidden" id="recordId">
      
      <div class="form-group">
        <label>Avtomobil modeli:</label>
        <input type="text" id="modelName" placeholder="Masalan: MAN, HOWO" required>
        <button type="button" class="voice-btn" onclick="startVoice('modelName')">🎙</button>
      </div>

      <div class="form-group">
        <label>Avtomobil raqami:</label>
        <input type="text" id="plateNumber" placeholder="01 A 777 AA" required oninput="this.value = this.value.toUpperCase()">
        <button type="button" class="voice-btn" onclick="startVoice('plateNumber')">🎙</button>
      </div>

      <div class="form-group">
        <label>Haydovchi ismi / F.I.Sh:</label>
        <input type="text" id="driverName" placeholder="Ismini kiriting" required>
        <button type="button" class="voice-btn" onclick="startVoice('driverName')">🎙</button>
      </div>

      <div class="form-group">
        <label>Berilgan pul (so'm):</label>
        <input type="number" id="paidAmount" placeholder="0">
      </div>

      <div class="form-group">
        <label>Qarzdorlik (so'm):</label>
        <input type="number" id="debtAmount" placeholder="0">
      </div>

      <button type="submit" class="btn" id="saveBtn">Saqlash</button>
      <button type="button" class="btn btn-cancel" id="cancelBtn" style="display:none;" onclick="resetForm()">Bekor qilish</button>
    </form>
  </div>

  <div class="card">
    <h3>Yuklamalar ro'yxati</h3>
    <!-- Excel tugmalari -->
    <button class="btn btn-excel" onclick="exportToExcel()">📥 Brauzer orqali yuklab olish (.XLSX)</button>
    <button class="btn btn-send" onclick="sendToTelegramChat()">📩 Telegram chatga hisobotni yuborish</button>
    
    <div style="overflow-x:auto;">
      <table id="dataTable">
        <thead>
          <tr>
            <th>Sana</th>
            <th>Model</th>
            <th>Nomer</th>
            <th>Haydovchi</th>
            <th>Berilgan pul</th>
            <th>Qarzdorlik</th>
            <th>Amallar</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot>
          <tr>
            <td colspan="4" style="text-align: right;">JAMI UMUMIY:</td>
            <td id="totalPaidSum" class="paid-text">0 so'm</td>
            <td id="totalDebtSum" class="debt-text">0 so'm</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const firebaseConfig = {
      databaseURL: "https://yuk-nazorati-default-rtdb.firebaseio.com/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allTruckData = {};

    function startVoice(inputId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Ovozli kiritish qo'llab-quvvatlanmaydi.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'uz-UZ';
      recognition.start();

      recognition.onresult = function(event) {
        let transcript = event.results[0][0].transcript;
        const inputElem = document.getElementById(inputId);
        if (inputId === 'plateNumber') {
          transcript = transcript.toUpperCase().replace(/\s+/g, '');
        }
        inputElem.value = transcript;
      };
    }

    document.getElementById('truckForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const recordId = document.getElementById('recordId').value;
      const paid = parseFloat(document.getElementById('paidAmount').value) || 0;
      const debt = parseFloat(document.getElementById('debtAmount').value) || 0;

      const recordData = {
        model: document.getElementById('modelName').value,
        plate: document.getElementById('plateNumber').value.toUpperCase(),
        driver: document.getElementById('driverName').value,
        paidAmount: paid,
        debtAmount: debt,
        date: new Date().toLocaleString('uz-UZ')
      };

      if (recordId) {
        db.ref('trucks/' + recordId).update(recordData, resetForm);
      } else {
        db.ref('trucks').push(recordData, resetForm);
      }
    });

    db.ref('trucks').on('value', (snapshot) => {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      allTruckData = snapshot.val() || {};

      let grandTotalPaid = 0;
      let grandTotalDebt = 0;

      for (let id in allTruckData) {
        const item = allTruckData[id];
        const paid = item.paidAmount || 0;
        const debt = item.debtAmount || 0;

        grandTotalPaid += paid;
        grandTotalDebt += debt;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.date || ''}</td>
          <td>${item.model}</td>
          <td><b>${item.plate}</b></td>
          <td>${item.driver}</td>
          <td class="paid-text">${paid > 0 ? paid.toLocaleString() + " so'm" : '-'}</td>
          <td class="debt-text">${debt > 0 ? debt.toLocaleString() + " so'm" : '-'}</td>
          <td class="actions-cell">
            <button class="action-btn btn-excel" onclick="editRecord('${id}')">✏️</button>
            <button class="action-btn btn-danger" onclick="deleteRecord('${id}')">🗑️</button>
          </td>
        `;
        tbody.appendChild(tr);
      }

      document.getElementById('totalPaidSum').innerText = grandTotalPaid.toLocaleString() + " so'm";
      document.getElementById('totalDebtSum').innerText = grandTotalDebt.toLocaleString() + " so'm";
    });

    window.editRecord = function(id) {
      const item = allTruckData[id];
      document.getElementById('recordId').value = id;
      document.getElementById('modelName').value = item.model;
      document.getElementById('plateNumber').value = item.plate;
      document.getElementById('driverName').value = item.driver;
      document.getElementById('paidAmount').value = item.paidAmount || '';
      document.getElementById('debtAmount').value = item.debtAmount || '';
      
      document.getElementById('formTitle').innerText = "Ma'lumotni tahrirlash";
      document.getElementById('saveBtn').innerText = "Yangilash";
      document.getElementById('cancelBtn').style.display = "block";
    };

    window.deleteRecord = function(id) {
      if (confirm("O'chirmoqchisiz?")) {
        db.ref('trucks/' + id).remove();
      }
    };

    function resetForm() {
      document.getElementById('truckForm').reset();
      document.getElementById('recordId').value = '';
      document.getElementById('formTitle').innerText = "Yangi yuk qo'shish";
      document.getElementById('saveBtn').innerText = "Saqlash";
      document.getElementById('cancelBtn').style.display = "none";
    }

    // 1. BRAUZERDA EXCEL YUKLASH (URL YARATISH ORQALI)
    function exportToExcel() {
      if (Object.keys(allTruckData).length === 0) {
        alert("Ma'lumot yo'q!");
        return;
      }

      const excelData = [];
      for (let id in allTruckData) {
        const item = allTruckData[id];
        excelData.push({
          "Sana": item.date || '',
          "Model": item.model || '',
          "Nomer": item.plate || '',
          "Haydovchi": item.driver || '',
          "Berilgan pul": item.paidAmount || 0,
          "Qarzdorlik": item.debtAmount || 0
        });
      }

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Yuklar");

      // Telegram Mini App xavfsizligini chetlab o'tib brauzer orqali yuklash
      const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'binary' });
      function s2ab(s) {
        const buf = new ArrayBuffer(s.length);
        const view = new Uint8Array(buf);
        for (let i = 0; i < s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
        return buf;
      }
      
      const blob = new Blob([s2ab(wbout)], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      
      // Tashqi brauzerda yuklash havolasini ochish
      if (tg && tg.openLink) {
        tg.openLink(url);
      } else {
        const a = document.createElement("a");
        a.href = url;
        a.download = `Yuk_Nazorati_${new Date().toISOString().slice(0,10)}.xlsx`;
        a.click();
      }
    }

    // 2. TELEGRAM CHATGA HISOBOT YUBORISH
    function sendToTelegramChat() {
      if (Object.keys(allTruckData).length === 0) {
        alert("Ma'lumot yo'q!");
        return;
      }

      let reportText = "📊 **YUK NAZORATI HISOBOTI**\n\n";
      let tPaid = 0, tDebt = 0;

      for (let id in allTruckData) {
        const item = allTruckData[id];
        const paid = item.paidAmount || 0;
        const debt = item.debtAmount || 0;
        tPaid += paid;
        tDebt += debt;

        reportText += `🚛 **${item.model}** (${item.plate})\n`;
        reportText += `👤 Haydovchi: ${item.driver}\n`;
        reportText += `💵 Berildi: ${paid.toLocaleString()} so'm\n`;
        reportText += `🔴 Qarz: ${debt.toLocaleString()} so'm\n`;
        reportText += `----------------------------\n`;
      }

      reportText += `\n💰 **JAMI BERILDI:** ${tPaid.toLocaleString()} so'm`;
      reportText += `\n❌ **JAMI QARZDORLIK:** ${tDebt.toLocaleString()} so'm`;

      tg.sendData(reportText);
    }
  </script>
</body>
</html>
